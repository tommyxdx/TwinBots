[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-crypto-bots"
version = "1.0.0"
description = "Research scanner and paper-only crypto execution laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "websockets>=14,<17"]

[project.scripts]
twobots = "twobots.cli:main"

[tool.setuptools.packages.find]
include = ["twobots*"]
